<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO22</title>
    <style>
        /* CSS Variables for consistent branding */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            --card-bg: #ffffff;
            --text-main: #102a43;
            --text-secondary: #486581;
            --accent-bg: #fee2e2;
            --accent-text: #991b1b;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'SolaimanLipi';
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Modern Marquee Style */
        .marquee-wrapper {
            background: var(--accent-bg);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            display: flex;
            align-items: center;
            border: 1px solid rgba(153, 27, 27, 0.1);
        }

        .marquee-label {
            background: var(--accent-text);
            color: white;
            padding: 8px 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
        }

        .marquee-content-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            font-size: 0.95rem;
            color: var(--accent-text);
            font-weight: 500;
            animation: scroll-text 20s linear infinite;
        }

        .marquee-wrapper:hover .marquee-text {
            animation-play-state: paused;
        }

        @keyframes scroll-text {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Button Grid */
        .download-section {
            display: grid;
            gap: 15px;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .btn-download svg {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .btn-download {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Senior Officer(22-based) Analysis</h1>

        <div class="marquee-wrapper">
            <div class="marquee-label">NOTICE</div>
            <div class="marquee-content-container">
                <div class="marquee-text">
                    বিস্তারিত এনালাইসিস এর পর Ratio- র সাথে চূড়ান্ত নিয়োগের কোনো সম্পর্ক পাওয়া যায় নি। &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; বিস্তারিত এনালাইসিস এর পর Ratio- র সাথে চূড়ান্ত নিয়োগের কোনো সম্পর্ক পাওয়া যায় নি।
                </div>
            </div>
        </div>

        <div class="download-section">
            <a href="photo1.jpg" download="so1.jpg" class="btn-download">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Analysis 1
            </a>

            <a href="photo2.jpg" download="so2.jpg" class="btn-download">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Analysis 2
            </a>
        </div>

        <p class="footer-note">Select an image above to save it to your device.</p>
    </div>

    <script>

        document.querySelectorAll('.btn-download').forEach(button => {
            button.addEventListener('click', function(e) {
                const fileName = this.getAttribute('download');
                console.log('Initiating download for: ' + fileName);
                

                const originalText = this.innerHTML;
                const btn = this;
                
                setTimeout(() => {
                    btn.style.opacity = '0.7';
                }, 100);
                
                setTimeout(() => {
                    btn.style.opacity = '1';
                }, 1000);
            });
        });
    </script>
</body>
</html>
